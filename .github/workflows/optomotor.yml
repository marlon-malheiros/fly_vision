name: Optomotor baseline reproduction
on:
  push:
    paths: ['optomotor_closed_loop/**', '.github/workflows/optomotor.yml']
  pull_request:
    paths: ['optomotor_closed_loop/**', '.github/workflows/optomotor.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: optomotor_closed_loop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: optomotor_closed_loop/requirements-reproduce.txt
      - run: python -m pip install -r requirements-reproduce.txt
      - run: python tools/check_baseline.py
      - run: python -m unittest discover -s tests -v
      - run: python tools/replay_baseline.py --output generated/ci_replay
